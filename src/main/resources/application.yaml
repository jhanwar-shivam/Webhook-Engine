spring:
  application:
    name: webhookengine
  datasource:
    url: jdbc:postgresql://localhost:5432/webhook_engine
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: webhook-dispatch-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8080
  threads:
    virtual:
      enabled: true

webhook:
  api:
    dispatch-path: /api/v1/events/dispatch
  kafka:
    dispatch-concurrency: 3
    topics:
      dispatch: webhooks.dispatch
      retry-10s: webhooks.retry.10s
      retry-1m: webhooks.retry.1m
      retry-5m: webhooks.retry.5m
      dlq: webhooks.dlq
  retry:
    max-delivery-attempts: 4
    max-throttle-retries: 100
  outbound-rate-limit:
    bucket-capacity: 600
    refill-per-second: 10
  dispatch:
    connect-timeout-seconds: 5
    http-timeout-seconds: 10
    listener-timeout-seconds: 30
